[package]
name = "patine"
version = "1.8.1"
edition = "2024"
license = "MPL-2.0"
description = "Render Markdown beautifully in the terminal"
authors = ["Jakob Westhoff <jakob@westhoffswelt.de>"]
homepage = "https://westhoffswelt.de"
repository = "https://github.com/jakobwesthoff/patine"
keywords = ["markdown", "terminal", "ansi", "renderer", "syntax-highlighting"]
categories = ["command-line-utilities", "text-processing"]

[features]
default = ["cli"]
# Builds the `patine` binary. Library users opt out with
# `default-features = false` and do not compile its argument parser or
# terminal size query.
cli = ["dep:clap", "dep:crossterm"]

[[bin]]
name = "patine"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"], optional = true }
crossterm = { version = "0.29.0", optional = true }
markdown = "1.0.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-default-fancy"] }
unicode-segmentation = "1.13.2"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.47.2"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
